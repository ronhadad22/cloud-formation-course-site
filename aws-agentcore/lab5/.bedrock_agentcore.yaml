# Bedrock AgentCore Starter Toolkit Configuration
# This file configures the agent for deployment

agents:
  my-langgraph-agent:
    name: my-langgraph-agent
    description: A LangGraph agent deployed on AWS Bedrock AgentCore
    entrypoint: agent.py
    runtime: python
    deployment_type: direct_code_deploy
    # Environment variables
    env:
      - AWS_REGION=eu-central-1
      - MODEL_ID=eu.anthropic.claude-sonnet-4-6
      - LOG_LEVEL=INFO
    # AWS configuration
    aws:
      region: eu-central-1
      account: "050752632489"
      execution_role: auto
      ecr: auto
    # Dependencies are auto-detected from requirements.txt
